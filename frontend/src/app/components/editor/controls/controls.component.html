<!-- Caja de ayuda de controles -->
<div class="controls">
    <p>Controles</p>
    <div class="control-wrapper">

        <div class="control-item">
            <span class="control-name">
                <fa-icon [icon]="faArrowsRotate"></fa-icon>
                <span class="text">Rotar anillo</span>
            </span>
            <span class="control-action left click">
                <fa-icon class="" [icon]="faComputerMouse"></fa-icon>
                <span class="text">Mantener clic izquierdo</span>
            </span>
        </div>

        <div class="control-item">
            <span class="control-name">
                <fa-icon [icon]="faUpDownLeftRight"></fa-icon>
                <span class="text">Mover anillo</span>
            </span>
            <span class="control-action right click"> 
                <fa-icon [icon]="faComputerMouse"></fa-icon>
                <span class="text">Mantener clic derecho</span>
            </span>
        </div>

        <div class="control-item">
            <span class="control-name">
                <fa-icon [icon]="faMagnifyingGlass"></fa-icon>
                <span class="text">Zoom</span>
            </span>
            <span class="control-action wheel">
                <fa-icon [icon]="faComputerMouse"></fa-icon>
                <span class="text">Usar la rueda del ratón</span>
            </span>
        </div>

        <div class="control-item">
            <span class="control-name">
                <fa-icon [icon]="faRing"></fa-icon>
                <span class="text">Editar componente</span>
            </span>
            <span class="control-action click left"> 
                <fa-icon [icon]="faComputerMouse"></fa-icon>
                <span class="text">Clic izquierdo</span>
            </span>
        </div>

    </div>
</div>
