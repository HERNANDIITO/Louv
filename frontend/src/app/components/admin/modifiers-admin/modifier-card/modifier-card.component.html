  <div class="row" [class.details-visible]="showDetails()">

    <div class="main-data">
      <span class="value name">{{ modifier().name }}</span>
      <span class="value category">{{ modifier().category }}</span>
      <span class="value category">{{ modifier().description ? modifier().description : 'NA' }}</span>
      <span class="value image-name">{{ getImageName() }}</span>

      <span class="value model">{{ getModel() }}</span>

      <button class="toggle-btn" (click)="toggleDetails()">
        <fa-icon

      </div>
