<div class="multi-switch">
  @for (option of options(); track $index) {
    <div class="state" 
         [class.active]="selectedIndex() === $index" 
         (click)="select($index)">
         @if(optionType() === "gem") {
          <fa-icon [icon]="faGem" size="sm"></fa-icon>
         }@else{
          <fa-icon [icon]="faObjectGroup" size="sm"></fa-icon>
         }
      {{ option }}
    </div>
  }
</div>
