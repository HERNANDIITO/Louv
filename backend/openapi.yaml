openapi: "3.0.0"
info:
  title: "Especificación del API Rest de Louv"
  description: "API Rest de Louv con información de administradores, usuarios, estructuras base, joyas, materiales, gemas, engastes, pedidos..."
  version: "1.0"
  contact:
    name: "Patata Team"
    email: "louv.spain@gmail.com"
    url: "https://louv.ovh/patataTeam/contacto"
servers:
  - url: "https://louv.ovh"
    description: "Servidor de producción"
  - url: "http://localhost:5000"
    description: "Servidor de desarrollo"
tags:
  - name: Auth
    description: "Operaciones de Autenticación y Registro"
  - name: Users
    description: "Operaciones sobre los Uusarios"
  - name: Materials
    description: "Operaciones sobre los Materiales"
  - name: Gemstones
    description: "Operaciones sobre las Gemas"
  - name: Box
    description: "Operaciones sobre las cajas de anillos."
  - name: Box-inner-material
    description: "Operaciones sobre los materiales del interior de las cajas de anillos."
  - name: Box-outer-material
    description: "Operaciones sobre los materiales del exterior de las cajas de anillos."
  - name: Box-detail-material
    description: "Operaciones sobre los detalles de las cajas de anillos."
  - name: Jewels
    description: "Operaciones sobre las joyas."
  - name: Base Structures
    description: "Operaciones sobre las bases de los anillos."
  - name: Orders
    description: "Operaciones sobre los pedidos de usuarios."
  - name: Employees
    description: "Operaciones sobre los Administradores"
  - name: Stats
    description: "Operaciones sobre las etadísticas."
  - name: Settings
    description: "Operaciones sobre los engastes de los anillos."

paths:
  /api/auth:
    get:
      tags:
        - Auth
      operationId: getAuth
      summary: "Obtener todos los usuarios autenticados"
      description: "Obtiene todos los usuarios registrados en el sistema (versión reducida de GET api/user)"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: "OK"
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
              example:
                result: "OK"
                users:
                - _id: 6938168c1cf7fd595d5a584b
                  name: "Belén"
                  surname: "Sempere"
                  email: "bel@gmail.com"
                  password: "$2b$10$bVEs0h/XcqZP5jPwOsE9ge5RCOBwzf/hSe1Jc1kARyyMEvwxo3MYO"
                  salt: "$2b$10$bVEs0h/XcqZP5jPwOsE9ge"
                  title: "Ms."
                  registrationDate: 2025-12-09T12:31:08.362+00:00
                  lastLogin: 2025-12-09T12:31:08.362+00:00
                  completeAccount: true
                - _id: 693816a31cf7fd595d5a5851
                  name: "Darío"
                  surname: "Pérez"
                  email: "dario@gmail.com"
                  password: "$2b$10$bVEs0h/XcqZP5jPwOsE9ge5RCOBwzf/hSe1Jc1kARyyMEvwxo3MYO"
                  salt: "$2b$10$bVEs0h/XcqZP5jPwOsE9ge"
                  title: "Mr."
                  registrationDate: 2025-12-09T12:31:08.362+00:00
                  lastLogin: 2025-12-09T12:31:08.362+00:00
                  completeAccount: true
        "400":
          $ref: '#/components/responses/BadRequestTokenFormat'
        "401":
          $ref: '#/components/responses/UnauthorizedTokenExpired'
        "403":
          $ref: '#/components/responses/Forbbiden'
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/me:
    get:
      tags:
        - Auth
      operationId: getAuthMe
      summary: "Obtener datos del usuario autenticado"
      description: "Obtiene al usuario autenticado a partir de un token JWT válido."
      security:
        - BearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                  User:
                    type: object
                example:
                  result: "OK"
                  User:
                    _id: "t35tgdfg5647444grrdt34"
                    email: "juan@mail.com"
                    name: "Juan Pérez"
        "400":
          $ref: '#/components/responses/BadRequestTokenFormat'
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/google:
    get:
      tags:
        - Auth
      operationId: getAuthGoogle
      summary: "Iniciar sesión con Google OAuth"
      description: "Realiza una redirección al servidor de autenticación de Google. En la URL de redirección se deberán proporcionar obligatoriamente los valores indicados en la documentación correspondiente de Google. Si todo es correcto, Google redirecciona de vuelta al usuario y proporciona un código temporal de autorización."
      responses:
        "302":
          description: Redirection
        "500":
          description: "Error interno del servidor"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                error interno del servidor:
                  value:
                    result: "KO"
                    message: "Error interno del servidor"
                oauth:
                  value:
                    result: "KO"
                    message: "Configuración de Google OAuth incompleta."
  /api/auth/google/callback:
    get:
      tags:
        - Auth
      operationId: getAuthGoogleCallback
      summary: "Callback de Google OAuth"
      description: "Maneja el callback de Google OAuth. Si el usuario no existe, crea uno temporal. Si ya existe, devuelve un JWT."
      parameters:
        - name: code
          in: query
          description: "Código de autorización proporcionado por Google"
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "302":
          description: Redirection
        "400":
          description: "Bad request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                result: "KO"
                message: "Código de autorización no encontrado."
        "500":
          description: "Error interno del servidor"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Configuración de Google OAuth incompleta:
                  value:
                    result: "KO"
                    message: "Configuración de Google OAuth incompleta."
                Error interno del servidor:
                  value:
                    result: "KO"
                    message: "Error interno del servidor."
  /api/auth/check-email:
    get:
      tags:
        - Auth
      operationId: checkUserEmail
      summary: "Comprobar si el email que ha introducido el usuario existe"
      description: "Comprueba si el email proporcionado como parámetro de consulta existe o no."
      parameters:
        - in: query       
          name: email
          schema:
            type: string
            example: "bsg37@alu.ua.es"
          required: true
          description: Email del usuario a comprobar
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                    example: true
        "400":
          description: "Bad request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                result: "KO"
                message: "Email requerido"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/register:
    post:
      tags:
        - Auth
      operationId: postAuthRegister
      summary: "Registro de un nuevo usuario"
      description: "Realiza un registro de un usuario con email y contraseña. No inicia sesión automáticamente."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              name: "Belén"
              surname: "Sempere"
              email: "bel@gmail.com"
              password: "contraseña_segura"
              title: "Ms."
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                  User:
                    type: object
                example:
                  result: "OK"
                  User:
                    _id: "t35tgdfg5647444grrdt34"
                    email: "juan@mail.com"
                    name: "Juan Pérez"
        "400":
          description: "Bad request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                value:
                  result: "KO"
                  message: "Lo sentimos, te faltan campos por rellenar."
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                  result: "KO"
                  message: "El email ya existe en la base de datos."
        "422":
          description: Unprocessable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Email no válido:
                  value:
                    result: "KO"
                    message: "Email no válido."
                Contraseña no válida:
                  value:
                    result: "KO"
                    message: "Contraseña no válida."
                Número de teléfono inválido:
                  value:
                    result: "KO"
                    message: "Número de teléfono inválido."
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/login:
    post:
      tags:
        - Auth
      operationId: postAuthLogin
      summary: "Inicio de sesión de usuario"
      description: "Realiza una identificación o login (signIn) de un usuario. Si todo es correcto, genera y devuelve un token JWT válido."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: "lsc82@alu.ua.es"
              password: "mi_contraseña_segura"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthSuccessResponse"
                  - $ref: "#/components/schemas/TOTPRequiredResponse"
        "422":
          description: "Unprocessable."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                result: "KO"
                message: "Email o contraseña no válidos."
        "400":
          description: "Bad request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                result: "KO"
                message: "Email o contraseña incorrectos."
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/totp:
    post:
      tags:
        - Auth
      operationId: postAuthTOTP
      summary: "Autenticar administrador con código TOTP"
      description: "Autentica a un administrador usando su código TOTP de 2FA."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPRequest"
            examples:
              Ejemplo de TOTP:
                value:
                  accountId: "507f1f77bcf86cd799439011"
                  totpCode: "123456"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "400":
          description: "Bad request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                    result: "KO"
                    message: "TOTP no configurado"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                result: "KO"
                message: "Código TOTP inválido."
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                result: "KO"
                message: "Usuario no encontrado"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/totp/setup:
    post:
      tags:
        - Auth
      operationId: postAuthTOTPSeutp
      summary: "Configurar el código TOTP"
      description: "Configura para un administrador su código TOTP."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPRequest"
            example:
              _id: "507f1f77bcf86cd799439011"
              email: "juan@gmail.com"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                  qrCodeDataUrl:
                    type: object
                example:
                  result: "OK"
                  qrCodeDataUrl: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMgAAADICAA..."
        "400":
          description: "Bad request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                    result: "KO"
                    message: "El token no cumple con el formato esperado."
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Token no encontrado:
                  value:
                    result: "KO"
                    message: "Token no encontrado. Por favor inicia sesión."
                Token expirado:
                  value:
                    result: "KO"
                    message: "Token caducado. Por favor inicia sesión."
        "403":
          $ref: "#/components/responses/Forbbiden"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                result: "KO"
                message: "Usuario no encontrado"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/totp/confirm:
    post:
      tags:
        - Auth
      operationId: postAuthTOTPSeutp
      summary: "Termina de configurar el TOTP y lo verifica."
      description: "Termina de configurar el codigo TOTP para un administrador verificando si el código introducido es correcto."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPRequest"
            example:
              _id: "507f1f77bcf86cd799439011"
              totpCode: "548305"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                example:
                  result: "OK"
        "400":
          description: "Bad request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                TOTP no configurado para esta cuenta:
                  value:
                    result: "KO"
                    message: "TOTP no configurado"
                Token con formato inválido:
                  value:
                    result: "KO"
                    message: "El token no cumple con el formato esperado."
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Token no encontrado:
                  value:
                    result: "KO"
                    message: "Token no encontrado. Por favor inicia sesión."
                Token expirado:
                  value:
                    result: "KO"
                    message: "Token caducado. Por favor inicia sesión."
                Codigo TOTP inválido: 
                  value:
                    result: "KO"
                    message: "Código TOTP inválido."
        "403":
          $ref: "#/components/responses/Forbbiden"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                result: "KO"
                message: "Cuenta no encontrada"
        "409":
          description: "Conflict"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                result: "KO"
                message: "TOTP ya ativado"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: Unprocessable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                result: "KO"
                message: "Faltan datos necesarios"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/exchange-temporal-code:
    post:
      tags:
        - Auth
      operationId: postAuthExchangeTemporalCode
      summary: "Intercambiar código temporal por token JWT"
      description: "Obtiene un usuario temporal a partir del código temporal enviado desde el frontend"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemporalCodeRequest"
            example:
              tempCode: "abc123def4560ffcf26ad3..."
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
              example:
                result: "OK"
                token: "eyJhbGciOiJIUzI1NiIsIn..."
        "400":
          description: "Bad request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                  result: "KO"
                  token: "Código temporal no encontrado."
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                result: "KO"
                token: "Usuario no encontrado."
        "410":
          description: "Gone"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                result: "KO"
                token: "El código temporal ha expirado."
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/complete-registration:
    put:
      tags:
        - Auth
      operationId: putAuthCompleteRegistration
      summary: "Completar registro de usuario temporal"
      description: "Completa el registro de un usuario temporal (creado por OAuth)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                _id: 
                  type: string
                  example: "6953e9dafaebb4ce85a3c328"
                email: 
                  type: string
                  example: "ana.gomez@example.com"
                name:
                  type: string
                  example: "Ana"
                surname: 
                  type: string
                  example: "Gómez"
                password: 
                  type: string
                  example: "Contrasena-segura-1234"
                title: 
                  type: "string"
                  example: "Ms."
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "409":
          description: "Conflict"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                result: "KO"
                message: "El/la usuario ya existe en la base de datos."
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/materials:
    get:
      tags:
        - Materials
      operationId: getMaterials
      summary: "Obtener todos los materiales"
      description: "Obtener todos los materiales registrados en el sistema."
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: "OK"
                  materials:
                    type: array
                    items: 
                      $ref: "#/components/schemas/Material"
              example:
                result: "OK"
                materials:
                  - _id: "60c72b2f9b1d4b1f1d8f5683"
                    material: "gold"
                    name: "Oro amarillo"
                    description: "Material precioso utilizado en joyería y monedas."
                    meaning: "Riqueza, prosperidad, estabilidad"
                    zodiac: 
                      - "leo"
                    recommendedGems:
                      - "60c72b2f9b1d4b1f1d8f5683"
                    purities:
                      - _id: "60c72b2f9b1d4b1f1d8f5684"
                        class: "Premium"
                        purity: "14K"
                        pricePermm3: 15675.00
                        allergies: false
                        allergens: []
                        composition: "100% oro"
                        image: "https://example.com/14k-gold.jpg"
                        texture: "Pulida"
                        description: "Oro puro, ideal para joyería de lujo."
                        meaning: "Pureza, claridad"
                  - _id: "60c72b2f9b1d4b1f1d8f5685"
                    material: "platinum"
                    name: "Platino"
                    description: "Aleación clásica de oro amarillo, cálida y duradera."
                    meaning: "Símbolo de valor y eternidad."
                    zodiac:
                      - "taurus"
                      - "leo"
                    recommendedGems:
                      - "60c72b2f9b1d4b1f1d8f5686"
                    purities:
                      - _id: "692f2c80c45be80b2734948c"
                        class: "14K"
                        purity: "14K"
                        pricePermm3: 40.00
                        allergies: false
                        allergens: []
                        composition: "92.5% plata, 7.5% cobre"
                        image: "https://example.com/sterling-platinum.jpg"
                        texture: "Mate"
                        description: "Buen balance entre precio y resistencia."
                        meaning: "Fuerza, balance"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Materials
      operationId: postMaterial
      summary: "Crear un nuevo material."
      description: "Añade a la base de datos un nuevo material."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Material'
            example:
              material: "gold"
              name: "Oro amarillo"
              description: "Material precioso ampliamente usado en joyería."
              meaning: "Riqueza, prosperidad y energía cálida."
              zodiac: ["leo", "aries"]
              recommendedGems: ["64fa12ab34cd56ef7890a111", "64fa12ab34cd56ef7890a112"]
              purities:
                - class: "Premium"
                  purity: "18K"
                  pricePermm3: 156.75
                  allergies: false
                  allergens: []
                  composition: "75% oro, 25% aleaciones"
                  image: "https://example.com/purity18.png"
                  texture: "Pulida"
                  description: "Pureza alta y muy resistente"
                  meaning: "Energía pura y claridad"
      responses:
        "201":
          description: "OK"
          content:
            application/json:
              schema:
                properties:
                  result:
                    type: string
                    example: "OK"
                  material:
                    $ref: '#/components/schemas/Material'
              example:
                result: "OK"
                material:
                  material: "gold"
                  name: "Oro amarillo"
                  description: "Material precioso ampliamente usado en joyería."
                  meaning: "Riqueza, prosperidad y energía cálida."
                  zodiac: ["leo", "aries"]
                  recommendedGems: ["64fa12ab34cd56ef7890a111", "64fa12ab34cd56ef7890a112"]
                  purities:
                    - class: "Premium"
                      purity: "18K"
