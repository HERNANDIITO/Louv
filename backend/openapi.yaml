    BaseStructure:
      type: object
      required:
        - name
        - description
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        name:
          type: string
        description:
          type: string
        defaultDesign:
          type: object
          properties:
            material:
              type: string
              description: Material ObjectId
            profile:
              type: string
              description: Profile ObjectId
        profiles:
          type: array
          items:
            type: object
            required:
              - profile
            properties:
              profile:
                type: string
                description: Profile ObjectId
              model:
                type: string
                description: Modelo 3D compartido
              volume:
                type: number
                format: double
                description: Volumen base para cálculo de precio
              variants:
                type: array
                items:
                  type: object
                  required:
                    - name
                    - image
                    - extraPrice
                  properties:
                    _id:
                      type: string
                      description: Variant ObjectId
                    name:
                      type: string
                      example: 3 gemas
                    image:
                      type: string
                      example: variant.png
                    extraPrice:
                      type: number
                      format: double
                      example: 120.5
                    modelBySize:
                      type: array
                      items:
                        type: object
                        required:
                          - size
                        properties:
                          size:
                            $ref: '#/components/schemas/SettingSize'
                          model:
                            type: string
                          volume:
                            type: number
                            format: double
                    settingsInfo:
                      type: array
                      items:
                        type: object
                        required:
                          - defaultsettingSize
                        properties:
                          compatibleSettings:
                            type: array
                            items:
                              type: object
                              required:
                                - setting
                              properties:
                                setting:
                                  type: string
                                  description: Setting ObjectId
                                scalePerSettingSize:
                                  type: array
                                  items:
                                    type: object
                                    required:
                                      - size
                                      - scale
                                    properties:
                                      size:
                                        $ref: '#/components/schemas/SettingSize'
                                      scale:
                                        type: number
                                        format: double
                          positionAndRotationPerSettingSize:
                            type: array
                            items:
                              type: object
                              required:
                                - size
                                - positionX
                                - positionY
                                - positionZ
                                - rotationX
                                - rotationY
                                - rotationZ
                              properties:
                                size:
                                  $ref: '#/components/schemas/SettingSize'
                                positionX:
                                  type: number
                                  format: double
                                positionY:
                                  type: number
                                  format: double
                                positionZ:
                                  type: number
                                  format: double
                                rotationX:
                                  type: number
                                  format: double
                                rotationY:
                                  type: number
                                  format: double
                                rotationZ:
                                  type: number
                                  format: double
                          defaultsettingSize:
                            $ref: '#/components/schemas/SettingSize'
                          defaultSettings:
                            type: array
                            items:
                              type: object
                              properties:
                                setting:
                                  type: string
                                  description: Setting ObjectId
                                gemstone:
                                  type: string
                                  description: Gemstone ObjectId
                                gemstoneCut:
                                  type: string
                                  description: Cut ObjectId
                                clawNumber:
                                  type: string
                                  description: Setting.clawNumber ObjectId
                                clawType:
                                  type: string
                                  description: Setting.clawType ObjectId
                                pattern:
                                  type: array
                                  items:
                                    type: string
                                    description: Gemstone ObjectId
    Order:
      type: object
      required:
        - orderNumber
        - user
        - state
        - cartCreationDate
        - lastUpdate
        - taxableTotalPrice
        - totalPrice
        - shippingPrice
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        orderNumber:
          type: string
          description: Número único del pedido
        user:
          type: string
          description: Referencia al usuario (User._id)
        state:
          type: string
          description: Estado del pedido
          enum:
            - inCart
            - ordered
            - delivered
          default: inCart
        cartCreationDate:
          type: string
          format: date-time
          description: Fecha de creación del carrito
        lastUpdate:
          type: string
          format: date-time
          description: Última actualización del pedido
        deliveryDate:
          type: string
          format: date-time
          nullable: true
          description: Fecha de entrega del pedido
        invoiceId:
          type: string
          nullable: true
          description: ID del sistema de facturación
        invoice:
          type: string
          nullable: true
          description: Documento o referencia de la factura
        taxableTotalPrice:
          type: string
          format: decimal
          description: Precio total sin IVA
          default: "0.00"
        totalPrice:
          type: string
          format: decimal
          description: Precio total con IVA (21%)
          default: "0.00"
        shippingPrice:
          type: string
          format: decimal
          description: Precio del envío
          default: "0.00"
        address:
          $ref: '#/components/schemas/Address'
        products:
          type: array
          description: Productos del pedido
          items:
            allOf:
              - $ref: '#/components/schemas/Jewelry'
              - type: object
                properties:
                  dedication:
                    type: string
                    description: Texto de dedicatoria
    Address:
      type: object
      description: Dirección de envío
      properties:
        street:
          type: string
          example: "Calle Mayor 10"
        city:
          type: string
          example: "Madrid"
        postalCode:
          type: string
          example: "28001"
        country:
          type: string
          example: "España"

    SettingSize:
      type: string
      description: Tamaño del engaste
      enum:
        - one-size
        - small
        - medium
        - big
    Setting:
      type: object
      properties:
        _id:
          type: string
          description: "ID único generado automáticamente por MongoDB."
        name:
          type: string
          description: "Nombre del engaste o configuración."
        type:
          type: string
          description: "Tipo de engaste."
          enum: 
            - prong
            - bezel
            - cluster
            - halo
            - pave
            - channel
            - tension
        compatibleCuts:
          type: array
          description: "Todos los cortes compatibles con este engaste y su imagen por gema."
          items:
            type: object
            properties:
              cut:
                type: string
                description: "ID del corte (referencia a Cut)."
              imagePerGem:
                type: array
                items:
                  type: object
                  properties:
                    gemstone:
                      type: string
                      description: "ID de la gema (referencia a Gemstone)."
                    image:
                      type: string
                      description: "Imagen para la sección Tipo de engaste."
                required:
                  - gemstone
        clawNumber:
          type: array
          description: "Variantes según número de garras."
          items:
            type: object
            properties:
              _id:
                type: string
                description: "ID único de la variante."
              name:
                type: string
                description: "Nombre de la variante."
              compatibleCuts:
                type: array
                items:
                  type: object
                  properties:
                    cut:
                      type: string
                      description: "ID del corte."
                    imagePerGem:
                      type: array
                      items:
                        type: object
                        properties:
                          gemstone:
                            type: string
                            description: "ID de la gema."
                          image:
                            type: string
                            description: "Imagen para la sección Número de garras."
                      required:
                        - gemstone
                    clawType:
                      type: array
                      items:
                        type: object
                        properties:
                          _id:
                            type: string
                          name:
                            type: string
                          cuts:
                            type: array
                            items:
                              type: object
                              properties:
                                cut:
                                  type: string
                                imagePerGem:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      gemstone:
                                        type: string
                                      image:
                                        type: string
                                    required:
                                      - gemstone
                          model:
                            type: string
                          gemPositionX:
                            type: number
                            format: float
                          gemPositionY:
                            type: number
                            format: float
                          gemPositionZ:
                            type: number
                            format: float
                          volume:
                            type: number
                            format: float
                          extraPrice:
                            type: number
                            format: float
                          pattern:
                            type: array
                            items:
                              type: object
                              properties:
                                gemPositionX:
                                  type: number
                                  format: float
                                gemPositionY:
                                  type: number
                                  format: float
                                gemPositionZ:
                                  type: number
                                  format: float
                                scaleFactor:
                                  type: number
                                  format: float
      required:
        - name
        - type
    Jewelry:
      type: object
      required:
        - name
        - user
        - creationDate
        - lastEdition
        - timesEdited
        - timeSpent
        - taxablePrice
        - currentPrice
        - timesHashRenewed
        - hasBeenInCart
        - composition
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
          example: 64f1a2e9b3c2a8a123456789
        name:
          type: string
        user:
          type: string
          description: User ObjectId
        creationDate:
          type: string
          format: date-time
        lastEdition:
          type: string
          format: date-time
        timesEdited:
          type: integer
          example: 3
          default: 1
        timeSpent:
          type: integer
          description: Tiempo total en segundos
          example: 560
        taxablePrice:
          type: number
          format: double
          example: 1250.75
        currentPrice:
          type: number
          format: double
          example: 1499.99
        taxableHistory:
          type: array
          items:
            type: number
            format: double
          example: [1000.0, 1150.5, 1250.75]
        priceHistory:
          type: array
          items:
            type: number
            format: double
          example: [1200.0, 1350.0, 1499.99]
        shareHashWithPrice:
          type: string
          example: abcd1234price
        shareHashWithoutPrice:
          type: string
          example: abcd1234noprice
        timesHashRenewed:
          type: integer
          example: 2
        hasBeenInCart:
          type: boolean
          example: false
        snapshot:
          type: string
          description: URL de la imagen del diseño
          example: default.png
        composition:
          $ref: '#/components/schemas/JewelryComposition'
        box:
          type: string
          description: Box ObjectId
        boxInnerColor:
          type: string
          description: BoxInnerColor ObjectId
        boxOuterColor:
          type: string
          description: BoxOuterColor ObjectId
        boxDetailColor:
          type: string
          description: BoxDetailColor ObjectId
    JewelryComposition:
      type: object
      required:
        - baseStructure
        - size
        - material
        - materialPurity
      properties:
        baseStructure:
          type: string
          description: BaseStructure ObjectId
        size:
          type: string
          description: Size ObjectId
        material:
          type: string
          description: Material ObjectId
        materialPurity:
          type: string
          description: Material purity ObjectId
        profile:
          type: string
          description: Profile ObjectId
        variant:
          type: string
          description: BaseStructure variant ObjectId
        settingsSize:
          $ref: '#/components/schemas/SettingSize'
        settings:
          type: array
          items:
            $ref: '#/components/schemas/JewelrySetting'
    JewelrySetting:
      type: object
      required:
        - isSynthetic
      properties:
        setting:
          type: string
          description: Setting ObjectId
        gemstone:
          type: string
          description: Gemstone ObjectId
        gemstoneCut:
          type: string
          description: Cut ObjectId
        isSynthetic:
          type: boolean
          default: false
        clawNumber:
          type: string
          description: Claw number ObjectId
        clawType:
          type: string
          description: Claw type ObjectId
        pattern:
          type: array
          items:
            type: object
            required:
              - isSynthetic
            properties:
              gemstone:
                type: string
                description: Gemstone ObjectId
              isSynthetic:
                type: boolean
                default: false
    AuthSuccessResponse: 
      type: object
      properties:
        result:
          type: string
          example: "OK"
        token:
          $ref: "#/components/schemas/Token"
    ErrorResponse: 
      type: object
      properties:
        result:
          type: string
          example: "KO"
        message:
          type: string
  responses:
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              result:
                type: string
                example: "500"
              message:
                type: string
                example: "Error interno del servidor."
    BadRequestTokenFormat:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              result:
                type: string
                example: "KO"
              message:
                type: string
                example: "El token no cumple con el formato esperado."
    UnauthorizedTokenExpired:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              result:
                type: string
                example: "KO"
              message:
                type: string
          examples:
            TokenNoEncontrado:
              summary: Token no encontrado
              value:
                result: "KO"
                message: "Token no encontrado. Por favor inicia sesión."
            TokenCaducado:
              summary: Token caducado
              value:
                result: "KO"
                message: "Token caducado. Por favor inicia sesión."
    Forbbiden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              result:
                type: string
                example: "KO"
              message:
                type: string
                example: "Lo sentimos, no tienes los permisos necesarios."
    UnsupportedMediaType:
      description: Unsupported Media Type
      content:
        application/json:
          schema:
            type: object
            properties:
              result:
                type: string
                example: "KO"
              message:
                type: string
                example: "El tipo mime del cuerpo de la petición no está soportado por el servidor."
    Unprocessable:
      description: Unprocessable Content
      content:
        application/json:
          schema:
            type: object
            properties:
              result:
                type: string
                example: "KO"
              message:
                type: string
                example: "No se ha podido procesar el cuerpo de la solicitud, por favor comprueba que esté bien formado."

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "La API usa un JSON Web Token (JWT) para la autenticación."
