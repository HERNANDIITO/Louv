    Employee:
      type: object
      properties:
        _id:
          type: string
          description: "ID único generado automáticamente por MongoDB."
        name:
          type: string
          description: "Nombre del empleado."
        surname:
          type: string
          description: "Apellido del empleado."
        email:
          type: string
          format: email
          description: "Correo electrónico único del empleado."
        password:
          type: string
          description: "Contraseña del empleado con salt hasheada."
        salt:
          type: string
          description: "Salt de la contraseña."
