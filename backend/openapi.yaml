components:
  schemas:
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          example: "Juan"
        surname:
          type: string
          example: "García"
        email:
          type: string
          format: email
          example: "juan@gmail.com"
        password:
          type: string
          format: password
        title:
          type: string
          example: "Mr."
        countryPrefix:
          type: string
          example: "+34"
        phone:
          type: string
          example: "612345678"
      required:
        - name
        - surname
        - email
        - password
        - title
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "lsc82@alu.ua.es"
        password:
          type: string
          format: password
      required:
        - email
        - password
    TOTPRequest:
      type: object
      properties:
        accountId:
          type: string
          description: "ID de la cuenta del administrador"
          example: "507f1f77bcf86cd799439011"
        totpCode:
          type: string
          description: "Código TOTP de 6 dígitos"
          example: "123456"
      required:
        - accountId
        - totpCode
    TemporalCodeRequest:
      type: object
      properties:
        tempCode:
          type: string
          description: "Código temporal generado durante OAuth"
          example: "abc123def456..."
      required:
        - tempCode
    TOTPRequiredResponse:
      type: object
      properties:
        result:
          type: string
          example: "TOTP_REQUIRED"
        message:
          type: string
          example: "Se requiere código TOTP"
        accountId:
          type: string
          description: "ID de la cuenta para usar en la solicitud TOTP"
          example: "507f1f77bcf86cd799439011"
    User:
      type: object
      properties:
        _id:
          type: string
          format: objectId
          description: "ID único del usuario."
        name:
          type: string
          description: "Nombre del usuario."
        surname:
          type: string
          description: "Apellido del usuario."
        email:
          type: string
          description: "Correo electrónico del usuario."
        password:
          type: string
          description: "Contraseña del usuario (normalmente no se devuelve por razones de seguridad)."
        salt:
          type: string
          description: "Valor de sal utilizado en la encriptación de la contraseña."
        dni:
          type: string
          description: "Documento nacional de identidad (opcional)."
        title:
          type: string
          description: "Título del usuario (por ejemplo, Sr., Sra., etc.)."
        countryPrefix:
          type: string
          description: "Prefijo telefónico del país del usuario."
        phone:
          type: string
          description: "Número de teléfono del usuario."
        registrationDate:
          type: string
          format: date-time
          description: "Fecha en la que el usuario se registró."
        lastLogin:
          type: string
          format: date-time
          description: "Fecha del último inicio de sesión del usuario."
        address:
          type: object
          properties:
            street:
              type: string
              description: "Calle de la dirección."
            city:
              type: string
              description: "Ciudad de la dirección."
            postalCode:
              type: string
              description: "Código postal de la dirección."
            country:
              type: string
              description: "País de la dirección."
        tempCode:
          type: object
          properties:
            code:
              type: string
              description: "Código temporal para OAuth."
            expiresAt:
              type: string
              format: date-time
              description: "Fecha de expiración del código temporal."
        completeAccount:
          type: boolean
          description: "Indica si la cuenta está completamente configurada."
      required:
        - name
        - surname
        - email
        - password
        - registrationDate
        - lastLogin
        - completeAccount
    Token:
      type: string
      description: "JSON Web Token (JWT) para futuras peticiones. Formato: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJfaWQiOiI2NzVhOGYzZTRmMWIyYzAwMWNkZTEyMzQiLCJlbWFpbCI6ImxzYzgyQGFsdS51YS5lcyIsImlhdCI6MTczMzkxMjM4MiwiZXhwIjoxNzMzOTk4NzgyfQ.dGhpc19pc19hX21vY2tfc2lnbmF0dXJlX2Zvcl9leGFtcGxl"
    Material:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
          example: "64fa12ab34cd56ef7890abcd"

        material:
          type: string
          enum: ["gold", "platinum"]
          description: Tipo de material
          example: "gold"

        name:
          type: string
          description: Nombre del material
          example: "Oro amarillo"

        description:
          type: string
          description: Descripción general del material
          example: "Un material precioso ampliamente utilizado en joyería."

        meaning:
          type: string
          description: Significado simbólico del material
          example: "Riqueza, prosperidad y energía cálida."

        zodiac:
          type: array
          description: Signos zodiacales asociados al material
          items:
            type: string
            enum:
              - aries
              - taurus
              - gemini
              - cancer
              - leo
              - virgo
              - libra
              - scorpio
              - sagittarius
              - capricorn
              - aquarius
              - pisces
            example: "leo"
          example: ["leo", "aries"]

        recommendedGems:
          type: array
          description: IDs de gemas recomendadas
          items:
            type: string
            example: "64fa12ab34cd56ef7890a111"
          example:
            - "64fa12ab34cd56ef7890a111"
            - "64fa12ab34cd56ef7890a112"

        purities:
          type: array
          description: Variantes de pureza del material
          items:
            type: object
            properties:
              _id:
                type: string
                description: MongoDB ObjectId
                example: "64fa12ab34cd56ef7890b001"
              class:
                type: string
                description: Clase de pureza
                example: "Premium"
              purity:
                type: string
                enum: ["10K", "14K", "18K"]
                description: Pureza del material
                example: "18K"
              pricePermm3:
                type: number
                format: double
                description: Precio por mm³
                example: 156.75
              allergies:
                type: boolean
                description: Indica si puede causar alergias
                example: false
              allergens:
                type: array
                description: Alergenos presentes
                items:
                  type: string
                  enum: ["nickel", "zinc", "copper", "silver", "other"]
                  example: "nickel"
                example: []
              composition:
                type: string
                description: Composición química del material
                example: "75% oro, 25% aleaciones"
              image:
                type: string
                description: URL de imagen alusiva
                example: "https://example.com/purity18.png"
              texture:
                type: string
                description: Textura del material
                example: "Pulida"
              description:
                type: string
                description: Descripción de esta pureza específica
                example: "Pureza alta y muy resistente"
              meaning:
                type: string
                description: Significado de esta pureza
                example: "Energía pura y claridad"
            required:
              - class
              - purity
              - pricePermm3
              - allergies
              - composition
              - image
              - texture
          example:
            - _id: "64fa12ab34cd56ef7890b001"
              class: "Premium"
              purity: "18K"
              pricePermm3: 156.75
              allergies: false
              allergens: []
              composition: "75% oro, 25% aleaciones"
              image: "https://example.com/purity18.png"
              texture: "Pulida"
              description: "Pureza alta y muy resistente"
              meaning: "Energía pura y claridad"

            - _id: "64fa12ab34cd56ef7890b002"
              class: "Standard"
              purity: "14K"
              pricePermm3: 110.50
              allergies: true
              allergens: ["nickel"]
              composition: "58% oro, 42% aleaciones"
              image: "https://example.com/purity14.png"
              texture: "Mate"
              description: "Buena durabilidad y color equilibrado"
              meaning: "Equilibrio y fortaleza"
      required:
        - material
        - name
    Gemstone:
      type: object
      properties:
        _id:
          type: string
          format: objectId
          description: "ID único de la gema."
        name:
          type: string
          description: "Nombre de la gema."
        description:
          type: string
          description: "Descripción de la gema."
        imagePerCut:
          type: array
          items:
            type: object
            properties:
              cut:
                type: string
                format: objectId
                description: "ID del tipo de corte de la gema."
              image:
                type: string
                description: "URL de la imagen de la gema con este corte."
        meaning:
          type: string
          description: "Significado asociado con la gema."
        zodiac:
          type: array
          items:
            type: string
            enum:
              - aries
              - taurus
              - gemini
              - cancer
              - leo
              - virgo
              - libra
              - scorpio
              - sagittarius
              - capricorn
              - aquarius
              - pisces
          description: "Signos del zodiaco asociados con la gema."
        recommendedMaterials:
          type: array
          items:
            type: string
            format: objectId
            description: "ID de los materiales recomendados para la gema."
        recommendedCuts:
          type: array
          items:
            type: string
            format: objectId
            description: "ID de los cortes recomendados para la gema."
        color:
          type: array
          items:
            type: string
            enum:
              - Transparente
              - Rojo
              - Azul
              - Verde
              - Amarillo
              - Naranja
              - Blanco
              - Morado
              - Rosa
              - Negro
          description: "Colores asociados con la gema."
        texture:
          type: string
          description: "Textura de la gema."
        hardness:
          type: number
          format: float
          description: "Dureza de la gema (escala de Mohs)."
        hasSynthetic:
          type: boolean
          description: "Indica si la gema tiene versión sintética."
        origin:
          type: string
          description: "Origen geográfico de la gema."
        qualities:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
                format: objectId
                description: "ID único para la calidad."
              caratRangeMin:
                type: number
                description: "Peso mínimo en quilates."
              caratRangeMax:
                type: number
                description: "Peso máximo en quilates."
              minScaleFactor:
                type: number
                format: float
                description: "Factor mínimo de escala."
              maxScaleFactor:
                type: number
                format: float
                description: "Factor máximo de escala."
              pricePerCaratNatural:
                type: number
                format: float
                description: "Precio por quilate para gemas naturales."
              pricePerCaratSynthetic:
                type: number
                format: float
                description: "Precio por quilate para gemas sintéticas."
      required:
        - name
        - texture
        - hardness
        - origin
        - hasSynthetic
    Box:
